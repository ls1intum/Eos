buildscript {
    configurations.classpath {
        // JReleaser needs JGit 5.x, but Spotless pulls in JGit 7, which removed classes JReleaser uses for signing
        resolutionStrategy.force "org.eclipse.jgit:org.eclipse.jgit:5.13.5.202508271544-r"
    }
}

plugins {
    id "java-library"
    id "maven-publish"
    id "com.diffplug.spotless" version "8.11.0"
    id "org.jreleaser" version "1.27.0"
    id "org.openjfx.javafxplugin" version "0.1.0"
}

group = "de.tum.cit.aet"
version = "2.0.0"

base {
    archivesName = "eos"
}

repositories {
    mavenCentral()
}

dependencies {
    // Ares 2 (https://github.com/ls1intum/Ares2) brings JUnit Jupiter, AssertJ and the sandbox annotations
    api "de.tum.cit.ase:ares:${ares_version}"

    api "org.testfx:testfx-core:${testfx_version}"
    api "org.testfx:testfx-junit5:${testfx_version}"
    api "org.hamcrest:hamcrest:3.0"
}

// JavaFX is platform specific. It is therefore not published as a dependency of Eos, the exercise
// adds it with the org.openjfx.javafxplugin, which picks the JARs matching the operating system.
javafx {
    version = javafx_version
    modules = [
        "javafx.base",
        "javafx.graphics",
        "javafx.controls",
        "javafx.swing"
    ]
    configuration = "compileOnly"
}

java {
    withSourcesJar()
    withJavadocJar()

    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
}

publishing {
    publications {
        mavenJava(MavenPublication) {
            artifactId = "eos"
            from components.java

            pom {
                name = "Eos"
                description = "Headless JavaFX Testing Framework for Education"
                url = "https://github.com/ls1intum/Eos"

                licenses {
                    license {
                        name = "MIT"
                        url = "https://opensource.org/licenses/MIT"
                    }
                }

                developers {
                    developer {
                        name = "Benjamin Schmitz"
                        email = "benjamin.schmitz@tum.de"
                        organization = "TUM Applied Education Technologies"
                        organizationUrl = "https://aet.cit.tum.de"
                    }
                }

                scm {
                    connection = "scm:git:https://github.com/ls1intum/Eos"
                    developerConnection = "scm:git:https://github.com/ls1intum/Eos"
                    url = "https://github.com/ls1intum/Eos"
                }
            }
        }
    }

    repositories {
        maven {
            url = layout.buildDirectory.dir("staging-deploy")
        }
    }
}

jreleaser {
    project {
        description = "Headless JavaFX Testing Framework for Education"
        copyright = "2025 TUM Applied Education Technologies"
    }

    signing {
        pgp {
            active = "ALWAYS"
            armored = true
        }
    }

    deploy {
        maven {
            mavenCentral {
                sonatype {
                    active = "ALWAYS"
                    url = "https://central.sonatype.com/api/v1/publisher"
                    stagingRepository("build/staging-deploy")
                    applyMavenCentralRules = true
                    verifyUrl = "https://repo1.maven.org/maven2/{{path}}/{{filename}}"
                }
            }
        }
    }
}

// Taken from the Artemis build.gradle (https://github.com/ls1intum/Artemis/blob/327857d0233168b77625451aa2136577a05be4ca/build.gradle)
spotless {
    java {
        target {
            fileTree(rootDir) {
                include(
                        "src/main/java/de/tum/cit/aet/eos/*.java",
                )
            }
        }
        importOrderFile "spotless.importorder"
        eclipse("4.33").configFile "spotless-style.xml"

        removeUnusedImports()
        trimTrailingWhitespace()
    }

    groovyGradle {
        target "*.gradle"
        greclipse().configFile("greclipse.properties")
    }
}

test {
    useJUnitPlatform()
}
