import org.gradle.api.tasks.InputFiles
import org.gradle.api.tasks.PathSensitive
import org.gradle.api.tasks.PathSensitivity
import org.gradle.api.tasks.testing.Test
import org.gradle.process.CommandLineArgumentProvider

plugins {
    id "checkstyle"
    id "pmd"
    id "com.github.spotbugs" version "6.5.13"
    id "maven-publish"
    id "com.teamscale" version "39.0.0"
    id "org.openjfx.javafxplugin" version "0.1.0"
    id "org.checkerframework" version "1.0.2"
    id "io.freefair.aspectj.post-compile-weaving" version "9.8.3"
}

apply plugin: "java"
apply plugin: "org.checkerframework"

// Only report nullness problems as warnings, they must not break the build
checkerFramework {
    version = "4.3.0"
    checkers = ["org.checkerframework.checker.nullness.NullnessChecker"]
    extraJavacArgs = ["-Awarns"]
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
}

repositories {
    mavenCentral()
    mavenLocal()
}

ext {
    eosVersion = "2.0.0"
    // Has to match the Ares version Eos is built against
    aresVersion = "2.2.1"
    aspectjVersion = "1.9.25.1"
}

configurations {
    // transitive = false: each configuration resolves to exactly one JAR, which is used by file path below
    aresAgent {
        canBeConsumed = false
        canBeResolved = true
        transitive = false
    }
    aresAspectjRuntime {
        canBeConsumed = false
        canBeResolved = true
        transitive = false
    }
    aresAspectPath {
        canBeConsumed = false
        canBeResolved = true
        transitive = false
    }
}

dependencies {
    testImplementation "de.tum.cit.aet:eos:${eosVersion}"

    aresAgent "de.tum.cit.ase:ares:${aresVersion}:agent"
    aresAspectjRuntime "org.aspectj:aspectjrt:${aspectjVersion}"
    testImplementation "de.tum.cit.ase:ares:${aresVersion}"
    // Puts Ares on the aspect path of ajc, otherwise nothing is woven
    aspect "de.tum.cit.ase:ares:${aresVersion}"
    implementation "org.aspectj:aspectjrt:${aspectjVersion}"
    aresAspectPath "de.tum.cit.ase:ares:${aresVersion}"

    implementation "org.apache.commons:commons-lang3:${commons_lang3_version}"

    checkstyle "org.apache.commons:commons-lang3:${commons_lang3_version}"
    checkstyle "com.puppycrawl.tools:checkstyle:${checkstyle_version}"
}

def assignmentSrcDir = "assignment/src"
def scaConfigDirectory = "$projectDir/staticCodeAnalysisConfig"

compileJava.options.encoding = "UTF-8"
compileTestJava.options.encoding = "UTF-8"

sourceSets {
    test {
        java {
            srcDir "test"
        }
        resources {
            srcDir "test"
        }
    }

    main {
        java {
            srcDirs = [assignmentSrcDir]
        }
        resources {
            srcDirs = []
        }
    }
}

// Only look for aspects in the Ares JAR instead of in all of its dependencies
tasks.named("compileJava") {
    ajc.options.aspectpath.setFrom(configurations.aresAspectPath)
}

// The test classes are trusted and need no weaving
tasks.named("compileTestJava") {
    ajc.enabled = false
}

abstract class AresJvmArguments implements CommandLineArgumentProvider {
    @InputFiles
    @PathSensitive(PathSensitivity.NONE)
    abstract ConfigurableFileCollection getAgentJar()

    @InputFiles
    @PathSensitive(PathSensitivity.NONE)
    abstract ConfigurableFileCollection getAspectjRuntimeJar()

    @Override
    Iterable<String> asArguments() {
        [
                "-javaagent:${agentJar.singleFile.absolutePath}".toString(),
                "-Xbootclasspath/a:${aspectjRuntimeJar.singleFile.absolutePath}".toString(),
                "--add-exports", "java.base/java.lang=ALL-UNNAMED",
                "--add-exports", "java.base/jdk.internal.misc=ALL-UNNAMED",
                "--add-opens", "java.base/java.io=ALL-UNNAMED",
                "--add-opens", "java.base/java.lang=ALL-UNNAMED",
                "--add-opens", "java.base/java.lang.reflect=ALL-UNNAMED",
                "--add-opens", "java.base/java.net=ALL-UNNAMED",
                "--add-opens", "java.base/java.nio=ALL-UNNAMED",
                "--add-opens", "java.base/java.nio.channels=ALL-UNNAMED",
                "--add-opens", "java.base/java.util=ALL-UNNAMED",
                "--add-opens", "java.base/java.util.concurrent=ALL-UNNAMED",
                "--add-opens", "java.base/java.util.concurrent.atomic=ALL-UNNAMED",
                "--add-opens", "java.base/java.util.concurrent.locks=ALL-UNNAMED",
                "--add-opens", "java.base/jdk.internal.misc=ALL-UNNAMED",
                "--add-opens", "java.base/sun.net.www.protocol.http=ALL-UNNAMED",
                "--add-opens", "java.base/sun.net.www.protocol.https=ALL-UNNAMED",
                "--add-opens", "java.base/sun.nio.ch=ALL-UNNAMED",
                "--add-opens", "jdk.unsupported/sun.misc=ALL-UNNAMED"
        ]
    }
}

def aresJvmArguments = objects.newInstance(AresJvmArguments)
aresJvmArguments.agentJar.from(configurations.aresAgent)
aresJvmArguments.aspectjRuntimeJar.from(configurations.aresAspectjRuntime)

test {
    defaultCharacterEncoding = "UTF-8"
    useJUnitPlatform()
    jvmArgumentProviders.add(aresJvmArguments)

    // Headless platform shipped with JavaFX (no Monocle required)
    systemProperty "glass.platform", "Headless"
    systemProperty "prism.order", "sw"
}

javafx {
    version = "27.0.1"
    // javafx.swing is required by Eos to save screenshots
    modules = ["javafx.base", "javafx.graphics", "javafx.controls", "javafx.swing"]
}

checkstyle {
    configFile = file("$scaConfigDirectory/checkstyle-configuration.xml")
    ignoreFailures = true
    // exclude the test files
    checkstyleTest.enabled = false
    checkstyleMain.reports {
        xml.outputLocation = file("target/checkstyle-result.xml")
    }
}

spotbugs {
    excludeFilter = file("$scaConfigDirectory/spotbugs-exclusions.xml")
    ignoreFailures = true
    // exclude the test files
    spotbugsTest.enabled = false
    spotbugsMain.reports {
        xml {
            required.set(true)
            outputLocation.set(file("target/spotbugsXml.xml"))
        }
        html.required.set(false)
    }
}

pmd {
    ruleSets = ["$scaConfigDirectory/pmd-configuration.xml"]
    rulesMinimumPriority = 5
    ignoreFailures = true
    toolVersion = "7.28.0"
}

tasks.named("pmdMain") {
    reports {
        xml.required.set(true)
        xml.outputLocation.set(file("target/pmd.xml"))
    }
}

tasks.named("pmdTest").configure {
    enabled = false
}

publishing {
    publications {
        create("mavenJava", MavenPublication) {
            groupId = "de.tum.in.ase"
            artifactId = "Artemis-Java-Gradle-Template"
            version = "1.6"
            from components.java
        }
    }
}

// Ares reserved-package build boundary, version 2 (copied from the Ares JAR)
apply from: "gradle/AresReservedPackages.gradle"

// Student classes must also not shadow the packages of Eos and the libraries it trusts
def eosReservedPackagePrefixes = ["de/tum/cit/aet/eos/", "javafx/", "org/testfx/", "org/junit/", "org/hamcrest/", "org/assertj/"]

tasks.register("verifyEosReservedPackages") {
    dependsOn tasks.named("classes")
    def studentClassesDirs = sourceSets.main.output.classesDirs
    def reservedPrefixes = eosReservedPackagePrefixes
    inputs.files(studentClassesDirs).withPropertyName("studentClasses")
    doLast {
        def forbidden = []
        studentClassesDirs.files.findAll { it.isDirectory() }.each { root ->
            root.eachFileRecurse { candidate ->
                def relative = root.toPath().relativize(candidate.toPath()).toString().replace(File.separator, "/")
                if (candidate.isFile() && reservedPrefixes.any { relative.startsWith(it) }) {
                    forbidden << relative
                }
            }
        }
        if (!forbidden.isEmpty()) {
            throw new GradleException("Student output must not use the reserved packages: ${forbidden.sort()}")
        }
    }
}

tasks.named("check") { dependsOn tasks.named("verifyEosReservedPackages") }
tasks.withType(Test).configureEach { dependsOn tasks.named("verifyEosReservedPackages") }

// Downloads what the tests of an Artemis exercise need at runtime (Ares agent, JUnit engines, JavaFX, JaCoCo agent, ...)
// without running them, so that the Docker image caches it.
tasks.register("resolveAresDependencies") {
    def resolvable = [configurations.testRuntimeClasspath, configurations.aresAgent,
                      configurations.aresAspectjRuntime, configurations.aspect, configurations.jacocoAgent]
    doLast {
        resolvable.each { it.resolve() }
    }
}
