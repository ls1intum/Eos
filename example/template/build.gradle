plugins {
    id 'java'
    id 'application'
    id 'org.openjfx.javafxplugin' version '0.1.0'
}

version = '2.0.0'
compileJava.options.encoding = 'UTF-8'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
}

repositories {
    mavenCentral()
}

javafx {
    version = '27.0.1'
    modules = ['javafx.base', 'javafx.graphics', 'javafx.controls']
}

application {
    mainModule = 'ExampleApp'
    mainClass = 'de.tum.cit.aet.javafx.exercise.ExampleApp'
}

sourceSets {
    main {
        java {
            srcDirs = ['src']
        }
    }
    test {
        java {
            srcDirs = []
        }
    }
}
